[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custody-schedule-spec"
version = "1.0.0"
description = "An open format and tool for parenting-time schedules, holiday rules and .ics calendar export."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["jsonschema>=4"]
authors = [{name = "Parallel Parent"}]
keywords = ["custody schedule", "parenting time", "parenting plan", "co-parenting", "ics", "calendar"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Office/Business :: Scheduling"]

[project.urls]
Homepage = "https://github.com/parallelparent/custody-schedule-spec"
Documentation = "https://custody-schedule-spec.readthedocs.io"

[project.scripts]
custody-schedule = "custody_schedule.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
custody_schedule = ["custody-schedule.schema.json"]
